<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="A Samba 4 domain controller with no public IP runs in mini-ad-subnet and reaches the internet through Cloud NAT. An Ubuntu VM and a Windows Server 2022 VM in the same subnet, both with public IPs, read the AD admin password from Secret Manager at boot and join the domain, the Linux one with realm and SSSD. An SSH client reaches the Linux VM and an RDP client the Windows one, signing in with AD accounts."><defs><marker id="a_e_ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_rdp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_lsec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_wsec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_ljoin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_wjoin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_nat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker></defs><rect width="1620" height="790" fill="#0d1117"/><path d="M600,95.0 H250.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_ssh)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">SSH :22</text><path d="M1020,95.0 H1370.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_rdp)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">RDP :3389</text><path d="M460,295.0 H595" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_lsec)"/><text x="530.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">join password</text><path d="M1160,295.0 H1025" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_wsec)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">join password</text><path d="M250.0,350 V495.0 H595" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_ljoin)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">SSSD</text><path d="M1370.0,350 V495.0 H1025" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_wjoin)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">domain member</text><path d="M810.0,550 V635" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_nat)"/><text x="824.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">outbound</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">SSH / RDP client</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">from the internet, AD credentials</text><rect x="40" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><g transform="translate(60,280.0) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="104.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">linux-ad VM</text><text x="104.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Ubuntu 24.04, e2-medium, public IP</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin